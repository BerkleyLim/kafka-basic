// ─────────────────────────────────────────────
// kafka-basic 빌드 파일
//
// 아키텍처에서의 위치 (docs/00-아키텍처와-구성.md §2, §5)
//   - Kafka 서버는 docker-compose.yml 이 띄운다. 이 파일은 "클라이언트 쪽(Java 실습 코드)" 만 책임진다
//   - 맨 아래 steps 표가 ./gradlew <이름> → 실행할 클래스 연결이다. 단계를 추가하면 여기에 한 줄 넣는다
//   - 테스트 두 종류: ReliableProcessorTest(브로커 없음), KafkaRoundTripIT(Testcontainers 가 임시 Kafka 를 띄움)
// ─────────────────────────────────────────────
plugins {
    id 'java'
}

group = 'com.clnewze.lab'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Kafka 공식 Java 클라이언트 — 이 저장소의 주인공. Spring 없이 이것만 쓴다
    implementation 'org.apache.kafka:kafka-clients:4.4.0'

    // 메시지 본문(JSON)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    // 로그 (kafka-clients 가 slf4j 로 로그를 남긴다)
    implementation 'ch.qos.logback:logback-classic:1.6.6'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 실제 Kafka 를 Docker 로 띄워서 하는 통합 테스트
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-kafka'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// ─────────────────────────────────────────────
// 실습 실행 태스크: ./gradlew <이름> [-Pargs="..."]
// ─────────────────────────────────────────────
// 이름          단계      역할
//   topic       step01    토픽 준비 (가장 먼저)
//   produce     step02    정상 이벤트 보내기
//   consume     step03    혼자 받기 (그룹 step03)
//   group       step04    여럿이 나눠 받기 (그룹 step04, 터미널 여러 개)
//   produceBad  step05    문제 섞인 이벤트 보내기
//   reliable    step05    중복 · 재시도 · DLT 처리하며 받기 (그룹 step05)
//   simulate    전체      Step 01~05 를 main 하나로 한 번에 (스레드로 소비자 5개, 결과 요약)
def steps = [
        topic      : 'com.clnewze.lab.kafka.step01.TopicSetup',
        produce    : 'com.clnewze.lab.kafka.step02.SimpleProducer',
        consume    : 'com.clnewze.lab.kafka.step03.SimpleConsumer',
        group      : 'com.clnewze.lab.kafka.step04.GroupConsumer',
        produceBad : 'com.clnewze.lab.kafka.step05.MixedEventProducer',
        reliable   : 'com.clnewze.lab.kafka.step05.ReliableConsumer',
        simulate   : 'com.clnewze.lab.kafka.simulation.FactorySimulation',
]

steps.each { taskName, mainClassName ->
    tasks.register(taskName, JavaExec) {
        group = 'kafka-basic'
        description = "실습 실행: ${mainClassName}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = mainClassName
        standardInput = System.in
        if (project.hasProperty('args')) {
            args project.property('args').toString().split(/\s+/)
        }
    }
}
