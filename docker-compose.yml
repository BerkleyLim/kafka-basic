# 단일 노드 Kafka (KRaft 모드 — ZooKeeper 없음)
#
#   docker compose up -d                  # Kafka 만
#   docker compose --profile ui up -d     # Kafka + 웹 UI (http://localhost:8989)
#
# 9092 를 이미 다른 Kafka 가 쓰고 있으면 포트를 바꿔서 띄운다 (예제 코드도 같은 값을 읽는다)
#   export KAFKA_PORT=9192 && docker compose up -d
#
# 리스너가 둘인 이유
#   - PLAINTEXT_HOST (localhost:9092) : 내 PC 에서 도는 Java 예제가 붙는 주소
#   - PLAINTEXT      (kafka:19092)    : 컨테이너 안(콘솔 도구 · UI)에서 붙는 주소
# 브로커는 접속한 클라이언트에게 "앞으로는 이 주소로 오라"(advertised.listeners)를 알려 준다.
# 이 값이 틀리면 첫 연결은 되는데 그다음부터 안 되는 증상이 난다 → docs/01-개념.md §7

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka-basic
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 브로커가 하나뿐이라 내부 토픽 복제 수를 1 로 낮춘다 (운영은 보통 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 실습에서는 토픽을 직접 만든다 (오타로 토픽이 생기는 사고를 막는 운영 기본값과 같다)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # 컨테이너 안에서는 내부 리스너(kafka:19092)로 붙는다.
      # localhost:9092 로 붙으면 브로커가 "localhost:${KAFKA_PORT}" 로 오라고 알려 주는데, 그 포트는 컨테이너 안에 없다
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    container_name: kafka-basic-ui
    profiles: ["ui"]
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
